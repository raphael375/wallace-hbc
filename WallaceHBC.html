<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Wallace HBC"/>
<meta name="theme-color" content="#c8102e"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wallace HBC Legé — U16A</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --red:#c8102e;--red2:#a00d24;--red-light:#ff1a3a;
  --white:#fff;--dark:#1a0a0b;--dark2:#2d1215;
  --gray:#6b6b6b;--radius:12px;--radius-lg:18px;
  --yellow:#f59e0b;--orange:#ea580c;
}
body{font-family:'Inter',sans-serif;background:var(--dark);color:var(--white);min-height:100vh;}
.screen{display:none;}.screen.active{display:block;}
.app-header{background:var(--red);padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;}
.live-badge{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.2);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1px;}
.viewers-badge{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.15);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;color:rgba(255,255,255,0.9);}
.live-dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}
.scoreboard{background:var(--red);padding:0 16px 16px;text-align:center;}
.teams-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:4px;}
.team-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:rgba(255,255,255,0.9);}
.team-name.home{text-align:right;}.team-name.away{text-align:left;}
.score-display{font-family:'Bebas Neue',sans-serif;font-size:64px;line-height:1;color:#fff;letter-spacing:2px;}
.match-info-bar{font-size:12px;color:rgba(255,255,255,0.7);margin-top:4px;}
.mi-badge{display:inline-block;background:rgba(255,255,255,0.2);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;margin:0 4px;}
.team-badge-pill{display:inline-block;background:rgba(255,255,255,0.25);padding:2px 10px;border-radius:12px;font-size:11px;font-weight:800;letter-spacing:1.5px;margin-bottom:6px;}
.chrono-bar{display:flex;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,0.25);padding:10px 16px;margin-top:8px;border-radius:12px;}
.chrono-display{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:3px;color:#fff;line-height:1;min-width:90px;text-align:center;}
.chrono-display.urgent{color:#fbbf24;animation:blink 0.8s ease-in-out infinite;}
.chrono-display.time-up{color:#f87171;}
.chrono-btn{padding:8px 14px;border-radius:20px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.15s;letter-spacing:0.5px;}
.chrono-btn.start{background:#86efac;color:#14532d;}
.chrono-btn.pause{background:#fbbf24;color:#78350f;}
.chrono-btn.reset{background:rgba(255,255,255,0.2);color:#fff;font-size:11px;}
.chrono-status{font-size:11px;color:rgba(255,255,255,0.6);letter-spacing:1px;text-transform:uppercase;}
.sanctions-live{display:none;background:rgba(234,88,12,0.2);border:1px solid rgba(234,88,12,0.5);border-radius:10px;padding:8px 12px;margin-top:8px;}
.sanctions-live.has-sanctions{display:block;}
.sanction-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0;}
.sanction-countdown{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fb923c;letter-spacing:1px;}
.sanction-countdown.urgent{color:#f87171;animation:blink 0.8s ease-in-out infinite;}
.content{padding:16px;}
.card{background:var(--dark2);border:1px solid rgba(200,16,46,0.25);border-radius:var(--radius-lg);padding:16px;margin-bottom:14px;}
.card-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px;color:var(--red-light);margin-bottom:12px;}
.players-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.player-btn{background:var(--dark);border:1.5px solid rgba(200,16,46,0.3);border-radius:var(--radius);padding:8px 4px 6px;cursor:pointer;text-align:center;transition:all 0.15s;position:relative;display:flex;flex-direction:column;align-items:center;}
.player-btn:active{transform:scale(0.95);}
.player-btn.has-goals{border-color:var(--red);background:rgba(200,16,46,0.15);}
.player-btn.has-sanction{border-color:var(--orange);background:rgba(234,88,12,0.15);}
.player-btn.has-yellow{border-color:var(--yellow);background:rgba(245,158,11,0.1);}
.player-photo{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.15);margin-bottom:3px;}
.player-num{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#fff;line-height:1;}
.player-name{font-size:10px;color:rgba(255,255,255,0.65);margin-top:1px;line-height:1.2;}
.player-goals{position:absolute;top:4px;right:4px;background:var(--red);color:#fff;width:17px;height:17px;border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.player-sanctions{position:absolute;top:4px;left:4px;display:flex;flex-direction:column;gap:1px;}
.sanction-icon{font-size:10px;line-height:1;}
.goalkeeper-badge{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);background:rgba(134,239,172,0.3);border:1px solid rgba(134,239,172,0.5);border-radius:4px;font-size:8px;font-weight:700;color:#86efac;padding:1px 4px;white-space:nowrap;}
.sanction-mode-bar{display:none;background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.4);border-radius:10px;padding:10px 12px;margin-bottom:12px;align-items:center;justify-content:space-between;gap:8px;}
.sanction-mode-bar.active{display:flex;}
.sanction-mode-label{font-size:13px;font-weight:700;color:#fbbf24;}
.stype-btn{padding:6px 12px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer;}
.stype-btn.yellow{background:#f59e0b;color:#1a0a0b;}
.stype-btn.two-min{background:#ea580c;color:#fff;}
.stype-btn.cancel-s{background:rgba(255,255,255,0.1);color:#fff;}
.goal-flash{display:none;position:fixed;inset:0;z-index:999;background:var(--red);align-items:center;justify-content:center;flex-direction:column;gap:12px;animation:flash-out 2.2s forwards;}
.goal-flash.show{display:flex;}
@keyframes flash-out{0%{opacity:1;}70%{opacity:1;}100%{opacity:0;pointer-events:none;}}
.goal-flash-text{font-family:'Bebas Neue',sans-serif;font-size:72px;letter-spacing:4px;color:#fff;animation:scale-in 0.3s ease-out;}
@keyframes scale-in{from{transform:scale(0.5);}to{transform:scale(1);}}
.goal-flash-sub{font-size:24px;color:rgba(255,255,255,0.9);font-weight:600;text-align:center;}
.timeline{display:flex;flex-direction:column;gap:8px;}
.tl-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--dark);border-radius:8px;border-left:3px solid var(--red);}
.tl-score{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--red-light);min-width:44px;}
.stats-grid{display:flex;flex-direction:column;gap:6px;}
.stat-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
.stat-row:last-child{border-bottom:none;}
.stat-photo{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid rgba(200,16,46,0.4);}
.stat-num-circle{width:36px;height:36px;border-radius:50%;background:rgba(200,16,46,0.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Bebas Neue',sans-serif;font-size:14px;color:rgba(255,255,255,0.6);}
.stat-info{flex:1;min-width:0;}
.stat-player{font-size:13px;color:#fff;font-weight:600;}
.stat-sub{font-size:10px;color:rgba(255,255,255,0.4);margin-top:1px;}
.stat-bar-bg{height:5px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;margin-top:3px;}
.stat-bar-fill{height:100%;background:var(--red);border-radius:3px;transition:width 0.5s ease;}
.stat-count{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--red-light);min-width:22px;text-align:right;flex-shrink:0;}
.btn-primary{width:100%;padding:14px;background:var(--red);color:#fff;border:none;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;transition:opacity 0.15s;}
.btn-primary:active{opacity:0.85;}
.btn-secondary{width:100%;padding:12px;background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,0.2);border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;}
.btn-danger{width:100%;padding:11px;background:transparent;color:#ff6b6b;border:1.5px solid rgba(255,107,107,0.3);border-radius:var(--radius);font-size:13px;cursor:pointer;margin-top:6px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:6px;letter-spacing:0.5px;text-transform:uppercase;}
.field input,.field select{width:100%;padding:12px 14px;background:var(--dark);color:#fff;border:1.5px solid rgba(255,255,255,0.15);border-radius:var(--radius);font-size:15px;outline:none;-webkit-appearance:none;}
.field input:focus,.field select:focus{border-color:var(--red);}
.half-btn{padding:8px 16px;border-radius:20px;border:1.5px solid rgba(255,255,255,0.2);background:transparent;color:rgba(255,255,255,0.6);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s;}
.half-btn.active{background:var(--red);border-color:var(--red);color:#fff;}
.halves-row{display:flex;gap:8px;margin-bottom:14px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--red);color:#fff;padding:12px 20px;border-radius:30px;font-size:14px;font-weight:600;transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);z-index:998;white-space:nowrap;box-shadow:0 4px 20px rgba(200,16,46,0.4);}
.toast.show{transform:translateX(-50%) translateY(0);}
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at top,#3a0a10 0%,var(--dark) 60%);position:relative;overflow:hidden;}
.logo-big{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:3px;color:#fff;text-align:center;line-height:1;margin-bottom:4px;position:relative;z-index:1;}
.logo-sub{font-size:12px;color:rgba(255,255,255,0.5);letter-spacing:3px;text-transform:uppercase;text-align:center;margin-bottom:32px;position:relative;z-index:1;}
.login-card{width:100%;max-width:360px;background:var(--dark2);border:1px solid rgba(200,16,46,0.3);border-radius:var(--radius-lg);padding:24px;position:relative;z-index:1;}
.role-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:20px;background:var(--dark);border-radius:10px;padding:4px;}
.role-tab{padding:9px;border:none;background:transparent;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;color:rgba(255,255,255,0.4);transition:all 0.15s;}
.role-tab.active{background:var(--red);color:#fff;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--dark2);border-top:1px solid rgba(200,16,46,0.2);display:flex;padding-bottom:env(safe-area-inset-bottom);}
.nav-item{flex:1;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:transparent;color:rgba(255,255,255,0.35);font-size:10px;font-weight:600;letter-spacing:0.5px;cursor:pointer;transition:color 0.15s;}
.nav-item.active{color:var(--red-light);}
.nav-icon{font-size:18px;}
.page-content{padding-bottom:80px;}
.reporter-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(200,16,46,0.3);border:1px solid rgba(200,16,46,0.5);padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--red-light);margin-bottom:16px;}
.arret-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.arret-btn{padding:14px 8px;border-radius:12px;cursor:pointer;font-size:12px;font-weight:700;border:1.5px solid rgba(22,101,52,0.5);background:rgba(22,101,52,0.3);color:#86efac;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;}
.arret-btn img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid rgba(134,239,172,0.4);}
</style>
</head>
<body>

  <div style="font-size:48px;font-family:Bebas Neue,sans-serif;letter-spacing:2px;" id="gf-score"></div>
</div>

// ─── PRESENCE ────────────────────────────────────────────────
async function registerPresence() {
  const sid = 'sess_' + Math.random().toString(36).substr(2,12);
  try {
    const res = await sbFetch('POST', '/rest/v1/hbc_presence', { session_id:sid, email:'', role:userRole, last_seen:new Date().toISOString() });
    presenceId = (res && res[0]) ? res[0].id : sid;
  } catch { presenceId = sid; }
  if (presenceInterval) clearInterval(presenceInterval);
  presenceInterval = setInterval(async () => {
    try { await sbFetch('PATCH', '/rest/v1/hbc_presence?id=eq.'+presenceId, { last_seen:new Date().toISOString() }); } catch {}
  }, 20000);
  window.addEventListener('beforeunload', () => {
    try { sbFetch('DELETE', '/rest/v1/hbc_presence?id=eq.'+presenceId, null); } catch {}
  });
}
async function fetchViewersCount() {
  try {
    const since = new Date(Date.now()-60000).toISOString();
    const rows = await sbFetch('GET', '/rest/v1/hbc_presence?last_seen=gte.'+since+'&select=id', null);
    const n = Array.isArray(rows) ? rows.length : 1;
    document.getElementById('viewers-count').textContent = n + VIEWERS_BOOST;
    document.getElementById('viewers-badge').style.display = 'flex';
  } catch {
    document.getElementById('viewers-count').textContent = VIEWERS_BOOST;
    document.getElementById('viewers-badge').style.display = 'flex';
  }
}

// ─── CHRONO ──────────────────────────────────────────────────
function chronoStartPause() {
  if (chronoState.running) {
    chronoState.running = false;
    clearInterval(chronoState.interval); chronoState.interval = null;
    document.getElementById('chrono-start-btn').textContent = '▶ Reprendre';
    document.getElementById('chrono-start-btn').className = 'chrono-btn start';
  } else {
    chronoState.running = true;
    document.getElementById('chrono-start-btn').textContent = '⏸ Pause';
    document.getElementById('chrono-start-btn').className = 'chrono-btn pause';
    chronoState.interval = setInterval(() => {
      if (chronoState.remaining > 0) {
        chronoState.remaining--;
        if (chronoState.remaining % 10 === 0) saveChronoToMatch();
        tickSanctions();
        updateChronoDisplay();
      } else {
        chronoState.running = false;
        clearInterval(chronoState.interval); chronoState.interval = null;
        saveChronoToMatch();
        showToast('⏰ TEMPS ÉCOULÉ !');
        sendNotif('⏰ Fin de la mi-temps !', 'Le temps est écoulé');
        updateChronoDisplay();
      }
    }, 1000);
  }
  saveChronoToMatch();
}

function chronoReset() {
  chronoState.running = false;
  clearInterval(chronoState.interval); chronoState.interval = null;
  chronoState.remaining = HALF_DURATION;
  if (document.getElementById('chrono-start-btn')) {
    document.getElementById('chrono-start-btn').textContent = '▶ Démarrer';
    document.getElementById('chrono-start-btn').className = 'chrono-btn start';
  }
  updateChronoDisplay();
  saveChronoToMatch();
}

function updateChronoDisplay() {
  const bar = document.getElementById('chrono-bar');
  const disp = document.getElementById('chrono-display');
  const status = document.getElementById('chrono-status');
  if (!match || match.status !== 'live') { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  const min = Math.floor(chronoState.remaining / 60);
  const sec = chronoState.remaining % 60;
  disp.textContent = String(min).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  disp.className = 'chrono-display';
  if (chronoState.remaining === 0) { disp.className += ' time-up'; status.textContent = 'TEMPS ÉCOULÉ'; }
  else if (chronoState.remaining <= 60) { disp.className += ' urgent'; status.textContent = "MOINS D'1 MIN !"; }
  else if (!chronoState.running) { status.textContent = 'EN PAUSE'; }
  else { status.textContent = 'TEMPS RESTANT'; }
  const ctrl = document.getElementById('chrono-controls');
  if (ctrl) ctrl.style.display = userRole === 'reporter' ? 'flex' : 'none';
}

async function saveChronoToMatch() {
  if (!match || !match.id) return;
  await sbFetch('PATCH', '/rest/v1/hbc_match?id=eq.'+match.id, {
    chrono_remaining: chronoState.remaining,
    chrono_running: chronoState.running,
    chrono_saved_at: new Date().toISOString(),
    sanctions: sanctions
  });
}

function restoreChronoFromMatch(m) {
  if (!m) return;
  if (m.chrono_remaining !== null && m.chrono_remaining !== undefined) {
    chronoState.remaining = m.chrono_remaining;
    if (m.chrono_running && m.chrono_saved_at && userRole === 'reporter') {
      const elapsed = Math.floor((Date.now() - new Date(m.chrono_saved_at).getTime()) / 1000);
      chronoState.remaining = Math.max(0, chronoState.remaining - elapsed);
      chronoState.running = true;
      if (chronoState.interval) clearInterval(chronoState.interval);
      chronoState.interval = setInterval(() => {
        if (chronoState.remaining > 0) {
          chronoState.remaining--;
          if (chronoState.remaining % 10 === 0) saveChronoToMatch();
          tickSanctions();
          updateChronoDisplay();
        } else {
          chronoState.running = false;
          clearInterval(chronoState.interval); chronoState.interval = null;
          saveChronoToMatch(); updateChronoDisplay();
        }
      }, 1000);
      document.getElementById('chrono-start-btn').textContent = '⏸ Pause';
      document.getElementById('chrono-start-btn').className = 'chrono-btn pause';
    }
  }
  if (m.sanctions) sanctions = m.sanctions;
}

// ─── SANCTIONS ───────────────────────────────────────────────
function tickSanctions() {
  const now = Date.now();
  let changed = false;
  sanctions.forEach(s => {
    if (s.type === '2min' && s.endTime && !s.expired) {
      s.remainingSeconds = Math.max(0, Math.floor((s.endTime - now) / 1000));
      if (s.remainingSeconds === 0) {
        s.expired = true; changed = true;
        sendNotif('🔄 ' + s.joueur_nom + ' est de retour !', 'La suspension de 2 minutes est terminée');
        showToast('🔄 #' + s.joueur_num + ' ' + s.joueur_nom + ' est de retour !');
      }
    }
  });
  if (changed) saveChronoToMatch();
  updateSanctionsDisplay();
}

function updateSanctionsDisplay() {
  const active = sanctions.filter(s => s.type === '2min' && !s.expired);
  const container = document.getElementById('sanctions-live');
  if (!active.length) { container.className = 'sanctions-live'; container.innerHTML = ''; return; }
  container.className = 'sanctions-live has-sanctions';
  container.innerHTML = active.map(s => {
    const min = Math.floor((s.remainingSeconds||0)/60);
    const sec = (s.remainingSeconds||0)%60;
    const urgent = (s.remainingSeconds||0) <= 30;
    const photoEl = PHOTOS[s.joueur_num] ? '<img src="'+PHOTOS[s.joueur_num]+'" style="width:28px;height:28px;border-radius:50%;object-fit:cover;margin-right:6px;">' : '';
    return '<div class="sanction-row"><div style="display:flex;align-items:center;">'+photoEl+'<div><div style="font-size:13px;font-weight:600;">⏱ #'+s.joueur_num+' '+s.joueur_nom+'</div><div style="font-size:10px;color:rgba(255,255,255,0.4);">En infériorité</div></div></div><div class="sanction-countdown'+(urgent?' urgent':'')+'">'+String(min).padStart(2,'0')+':'+String(sec).padStart(2,'0')+'</div></div>';
  }).join('');
}

function toggleSanctionMode() {
  sanctionMode = !sanctionMode;
  document.getElementById('sanction-mode-bar').classList.toggle('active', sanctionMode);
  document.getElementById('sanction-toggle-btn').style.background = sanctionMode ? 'rgba(245,158,11,0.4)' : 'rgba(245,158,11,0.2)';
  if (!sanctionMode) { document.getElementById('sanction-mode-bar').classList.remove('active'); }
}
function setSanctionType(type) {
  sanctionType = type; sanctionMode = true;
  document.getElementById('sanction-mode-bar').classList.add('active');
  document.getElementById('sanction-mode-label').textContent = type === 'yellow' ? '🟡 Cliquer sur le joueur (carton jaune)' : '⏱ Cliquer sur le joueur (2 minutes)';
}
function cancelSanctionMode() {
  sanctionMode = false;
  document.getElementById('sanction-mode-bar').classList.remove('active');
  document.getElementById('sanction-toggle-btn').style.background = 'rgba(245,158,11,0.2)';
}
async function addSanction(joueur) {
  if (!match || match.status !== 'live') { showToast('Aucun match en cours'); return; }
  const s = { id:Date.now(), joueur_num:joueur.num, joueur_nom:joueur.nom, type:sanctionType, half:half, time:new Date().toISOString(), expired:false, remainingSeconds:sanctionType==='2min'?120:null, endTime:sanctionType==='2min'?Date.now()+120000:null };
  sanctions.push(s);
  await saveChronoToMatch();
  triggerFlash(sanctionType === 'yellow' ? '🟡 CARTON JAUNE' : '⏱ 2 MINUTES !', '#' + joueur.num + ' ' + joueur.nom, '', sanctionType === 'yellow' ? '#b45309' : '#9a3412');
  showToast(sanctionType === 'yellow' ? '🟡 Carton jaune — ' + joueur.nom : '⏱ 2 min — ' + joueur.nom + ' sort !');
  cancelSanctionMode(); updateUI();
}

// ─── LOGIN ───────────────────────────────────────────────────
function setRole(role) {
  userRole = role;
  document.getElementById('tab-spectateur').classList.toggle('active', role==='spectateur');
  document.getElementById('tab-reporter').classList.toggle('active', role==='reporter');
  document.getElementById('reporter-fields').style.display = role==='reporter' ? 'block' : 'none';
}
async function doLogin() {
  if (userRole === 'reporter') {
    const code = document.getElementById('login-code').value.trim();
    if (code !== REPORTER_CODE) { showToast('Code reporter incorrect ❌'); return; }
  }
  if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission();
  showScreen('screen-main');
  await loadMatch();
  initNav();
  if (userRole === 'reporter') {
    document.getElementById('chrono-controls').style.display = 'flex';
  }
  updateChronoDisplay();
  updateSanctionsDisplay();
  await registerPresence();
  await fetchViewersCount();
  setInterval(fetchViewersCount, 20000);
}

// ─── MATCH ───────────────────────────────────────────────────
async function loadMatch() {
  const rows = await sbFetch('GET', '/rest/v1/hbc_match?team=eq.U16A&order=created_at.desc&limit=1', null);
  if (rows && rows.length > 0) {
    match = rows[0]; goals = rows[0].goals || []; half = rows[0].half || 1;
    restoreChronoFromMatch(rows[0]);
  }
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(pollMatch, 5000);
  updateUI();
  document.getElementById('live-badge').style.display = match?.status === 'live' ? 'flex' : 'none';
}

async function pollMatch() {
  const rows = await sbFetch('GET', '/rest/v1/hbc_match?team=eq.U16A&order=created_at.desc&limit=1', null);
  if (!rows || !rows.length) return;
  const oldGoalsCount = goals.length;
  const oldStatus = match?.status;
  const oldHalf = match?.half;
  match = rows[0]; goals = rows[0].goals || []; half = rows[0].half || 1;
  // Sync chrono pour spectateurs
  if (userRole === 'spectateur') {
    if (match.chrono_remaining !== null && match.chrono_remaining !== undefined) {
      if (match.chrono_running && match.chrono_saved_at) {
        const elapsed = Math.floor((Date.now() - new Date(match.chrono_saved_at).getTime()) / 1000);
        chronoState.remaining = Math.max(0, match.chrono_remaining - elapsed);
      } else {
        chronoState.remaining = match.chrono_remaining || HALF_DURATION;
      }
      chronoState.running = match.chrono_running || false;
    }
    if (match.sanctions) {
      sanctions = match.sanctions;
      sanctions.forEach(s => { if (s.type==='2min'&&s.endTime&&!s.expired) s.remainingSeconds = Math.max(0,Math.floor((s.endTime-Date.now())/1000)); });
    }
  }
  if (goals.length > oldGoalsCount) {
    const last = goals[goals.length-1];
    triggerGoalFlash(last);
    if (userRole === 'spectateur') {
      last.team === 'away'
        ? sendNotif('⚽ But adverse !', 'HBC ' + last.score_home + '–' + last.score_away + ' ' + match.adversaire)
        : sendNotif('🤾 BUT de ' + last.joueur_nom + ' !', 'HBC ' + last.score_home + '–' + last.score_away + ' ' + match.adversaire);
    }
  }
  if (oldHalf === 1 && match.half === 2) { sendNotif('🔔 MI-TEMPS !', 'Score : ' + match.score_home + '–' + match.score_away); showToast('MI-TEMPS ! 🔔'); }
  if (oldStatus === 'live' && match.status === 'finished') { sendNotif('🏆 MATCH TERMINÉ !', 'Score final : ' + match.score_home + '–' + match.score_away); showToast('MATCH TERMINÉ ! 🏆'); }
  document.getElementById('live-badge').style.display = match?.status === 'live' ? 'flex' : 'none';
  updateChronoDisplay(); updateSanctionsDisplay(); updateUI();
}

// Ticker spectateur
setInterval(() => {
  if (userRole === 'spectateur') {
    if (chronoState.running && chronoState.remaining > 0) chronoState.remaining--;
    sanctions.forEach(s => { if (s.type==='2min'&&s.endTime&&!s.expired) { s.remainingSeconds = Math.max(0,Math.floor((s.endTime-Date.now())/1000)); if(s.remainingSeconds===0&&!s.expired){s.expired=true;sendNotif('🔄 '+s.joueur_nom+' est de retour !','');showToast('🔄 #'+s.joueur_num+' '+s.joueur_nom+' est de retour !');} } });
    updateChronoDisplay(); updateSanctionsDisplay();
  }
}, 1000);

async function saveMatch(data) {
  if (match && match.id) await sbFetch('PATCH', '/rest/v1/hbc_match?id=eq.'+match.id, data);
  else { const res = await sbFetch('POST', '/rest/v1/hbc_match', {...data, team:'U16A'}); if(res&&res[0]) match=res[0]; }
}

async function resetMatch() {
  if (!confirm('Effacer le match et repartir à zéro ?')) return;
  if (match&&match.id) await sbFetch('DELETE', '/rest/v1/hbc_match?id=eq.'+match.id, null);
  match=null; goals=[]; sanctions=[]; half=1;
  chronoState.remaining=HALF_DURATION; chronoState.running=false;
  clearInterval(chronoState.interval); chronoState.interval=null;
  showToast('Match effacé ✓'); switchPage('setup');
}

async function startMatch() {
  const adv = document.getElementById('setup-adversaire').value.trim();
  const date = document.getElementById('setup-date').value;
  const lieu = document.getElementById('setup-lieu').value.trim();
  if (!adv) { showToast("Merci de saisir l'adversaire"); return; }
  match=null; goals=[]; sanctions=[]; half=1;
  chronoState.remaining=HALF_DURATION; chronoState.running=false;
  const data = { team:'U16A', adversaire:adv, date, lieu, score_home:0, score_away:0, goals:[], arrets:0, arrets_detail:{}, half:1, status:'live', sanctions:[], chrono_remaining:HALF_DURATION, chrono_running:false, chrono_saved_at:new Date().toISOString(), created_at:new Date().toISOString() };
  await saveMatch(data);
  document.getElementById('live-badge').style.display = 'flex';
  updateChronoDisplay(); updateUI();
  showToast('Match lancé ! 🏁'); switchPage('live');
}

async function addGoal(joueur) {
  if (sanctionMode) { await addSanction(joueur); return; }
  if (!match||match.status!=='live') { showToast('Aucun match en cours'); return; }
  const scoreHome = (match.score_home||0)+1;
  const goal = { joueur_num:joueur.num, joueur_nom:joueur.nom, half, score_home:scoreHome, score_away:match.score_away||0, time:new Date().toISOString() };
  goals.push(goal); match.score_home=scoreHome; match.goals=goals;
  await saveMatch({ score_home:scoreHome, goals, half });
  triggerGoalFlash(goal); updateUI();
  showToast('BUT de ' + joueur.nom + ' ! 🎯');
}

async function addGoalAway() {
  if (!match||match.status!=='live') { showToast('Aucun match en cours'); return; }
  const scoreAway = (match.score_away||0)+1;
  const goal = { joueur_num:'—', joueur_nom:match.adversaire||'Adverse', team:'away', half, score_home:match.score_home||0, score_away:scoreAway, time:new Date().toISOString() };
  goals.push(goal); match.score_away=scoreAway; match.goals=goals;
  await saveMatch({ score_away:scoreAway, goals });
  updateUI(); showToast('But adverse 😤');
}

async function addArret(gardien) {
  if (!match||match.status!=='live') { showToast('Aucun match en cours'); return; }
  const key = 'arret_'+gardien.num;
  const arrets_detail = match.arrets_detail || {};
  arrets_detail[gardien.num] = (arrets_detail[gardien.num]||0)+1;
  const total = Object.values(arrets_detail).reduce((a,b)=>a+b,0);
  match.arrets=total; match.arrets_detail=arrets_detail;
  await saveMatch({ arrets:total, arrets_detail });
  triggerFlash('ARRÊT !', '🧤 ' + gardien.nom.toUpperCase() + ' !', arrets_detail[gardien.num] + ' arrêt' + (arrets_detail[gardien.num]>1?'s':''), '#166534');
  updateUI(); showToast('Arrêt de ' + gardien.nom + ' ! 🧤');
}

async function cancelLastGoal() {
  if (!goals.length) { showToast('Aucun but à annuler'); return; }
  goals.pop();
  const scoreHome = Math.max(0,(match.score_home||1)-1);
  match.score_home=scoreHome; match.goals=goals;
  await saveMatch({ score_home:scoreHome, goals });
  updateUI(); showToast('Dernier but annulé ↩');
}

async function endMatch() {
  if (!confirm('Terminer le match ?')) return;
  chronoState.running=false; clearInterval(chronoState.interval); chronoState.interval=null;
  await saveMatch({ status:'finished', chrono_running:false });
  match.status='finished';
  document.getElementById('live-badge').style.display = 'none';
  updateUI(); showToast('Match terminé ! 🏆');
}

function setHalf(h) {
  half=h;
  document.getElementById('btn-h1').classList.toggle('active',h===1);
  document.getElementById('btn-h2').classList.toggle('active',h===2);
  chronoState.remaining=HALF_DURATION; chronoState.running=false;
  clearInterval(chronoState.interval); chronoState.interval=null;
  if(document.getElementById('chrono-start-btn')){document.getElementById('chrono-start-btn').textContent='▶ Démarrer';document.getElementById('chrono-start-btn').className='chrono-btn start';}
  if(match) saveMatch({ half:h, chrono_remaining:HALF_DURATION, chrono_running:false });
  updateChronoDisplay(); updateUI();
}

// ─── UI ──────────────────────────────────────────────────────
function updateUI() {
  document.getElementById('score-display').textContent = (match?.score_home||0) + ' – ' + (match?.score_away||0);
  document.getElementById('team-away-name').textContent = match?.adversaire||'ADV';
  document.getElementById('badge-half').textContent = (match?.half||1)===1 ? '1ère MT' : '2ème MT';
  document.getElementById('match-date-display').textContent = match?.date ? new Date(match.date).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'long'}) : '';
  let sb=document.getElementById('status-banner');
  if(!sb){sb=document.createElement('div');sb.id='status-banner';sb.style.cssText='display:none;text-align:center;padding:8px;font-family:Bebas Neue,sans-serif;font-size:16px;letter-spacing:2px;';document.querySelector('.scoreboard').appendChild(sb);}
  sb.style.display=match?.status==='finished'?'block':'none';
  if(match?.status==='finished'){sb.style.color='#86efac';sb.textContent='✓ MATCH TERMINÉ';}

  // Grille joueurs
  const grid = document.getElementById('players-grid');
  if (grid) {
    const gpMap={};goals.forEach(g=>{gpMap[g.joueur_num]=(gpMap[g.joueur_num]||0)+1;});
    const spMap={};sanctions.forEach(s=>{if(!spMap[s.joueur_num])spMap[s.joueur_num]=[];spMap[s.joueur_num].push(s);});
    grid.innerHTML = JOUEURS.map(j => {
      const gs=gpMap[j.num]||0;const ss=spMap[j.num]||[];
      const hasActive2min=ss.some(s=>s.type==='2min'&&!s.expired);
      const yellowCount=ss.filter(s=>s.type==='yellow').length;
      let cls='player-btn';
      if(hasActive2min) cls+=' has-sanction';
      else if(yellowCount) cls+=' has-yellow';
      else if(gs) cls+=' has-goals';
      const icons=ss.map(s=>s.type==='yellow'?'<span class="sanction-icon">🟡</span>':'<span class="sanction-icon" style="'+(s.expired?'opacity:0.3':'')+'">⏱</span>').join('');
      const photoEl = PHOTOS[j.num]
        ? '<img class="player-photo" src="'+PHOTOS[j.num]+'">'
        : '<div class="player-num">'+j.num+'</div>';
      const nameEl = '<div class="player-name">#'+j.num+' '+j.nom+'</div>';
      const gardienBadge = j.gardien ? '<div class="goalkeeper-badge">🧤 GK</div>' : '';
      return '<button class="'+cls+'" onclick="addGoal('+JSON.stringify(j).replace(/"/g,"&quot;")+')">'
        +(gs?'<div class="player-goals">'+gs+'</div>':'')
        +'<div class="player-sanctions">'+icons+'</div>'
        +photoEl+nameEl+gardienBadge+'</button>';
    }).join('');
  }

  // Boutons arrêt gardien
  const arretGrid = document.getElementById('arret-grid');
  if (arretGrid) {
    const ad = match?.arrets_detail || {};
    arretGrid.innerHTML = GARDIENS.map(g => {
      const count = ad[g.num]||0;
      const photoEl = PHOTOS[g.num] ? '<img src="'+PHOTOS[g.num]+'" style="width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid rgba(134,239,172,0.4);">' : '';
      return '<button class="arret-btn" onclick="addArret('+JSON.stringify(g).replace(/"/g,"&quot;")+')">'
        +photoEl
        +'<div>#'+g.num+' '+g.nom+'</div>'
        +'<div style="font-size:16px;font-family:Bebas Neue,sans-serif;color:#86efac;">'+count+' arrêt'+(count>1?'s':'')+'</div>'
        +'</button>';
    }).join('');
  }

  // Demi-temps buttons
  const bh1=document.getElementById('btn-h1');const bh2=document.getElementById('btn-h2');
  if(bh1){bh1.classList.toggle('active',half===1);bh2.classList.toggle('active',half===2);}

  // Stats
  const sg=document.getElementById('stats-grid');
  if(sg){
    if(!match){sg.innerHTML='<div style="text-align:center;color:rgba(255,255,255,0.3);padding:20px;font-size:14px;">Aucun match en cours</div>';}
    else{
      const gpMap={};goals.forEach(g=>{gpMap[g.joueur_nom]=(gpMap[g.joueur_nom]||0)+1;});
      const spMap={};sanctions.forEach(s=>{if(!spMap[s.joueur_nom])spMap[s.joueur_nom]=[];spMap[s.joueur_nom].push(s);});
      const maxG=Math.max(...Object.values(gpMap),1);
      const sorted=JOUEURS.filter(j=>!j.gardien).map(j=>({...j,goals:gpMap[j.nom]||0,scts:spMap[j.nom]||[]})).sort((a,b)=>b.goals-a.goals);
      sg.innerHTML=sorted.map(j=>{
        const yc=j.scts.filter(s=>s.type==='yellow').length;
        const tm=j.scts.filter(s=>s.type==='2min').length;
        const sub=[yc?'🟡 x'+yc:'',tm?'⏱ x'+tm:''].filter(Boolean).join(' ');
        const pct=j.goals?(j.goals/maxG*100):0;
        return '<div class="stat-row">'
          +(PHOTOS[j.num]?'<img class="stat-photo" src="'+PHOTOS[j.num]+'">'
            :'<div class="stat-num-circle">'+j.num+'</div>')
          +'<div class="stat-info"><div class="stat-player">#'+j.num+' '+j.nom+'</div>'
          +(sub?'<div class="stat-sub">'+sub+'</div>':'')
          +'<div class="stat-bar-bg"><div class="stat-bar-fill" style="width:'+pct+'%"></div></div></div>'
          +'<div class="stat-count">'+(j.goals||'—')+'</div></div>';
      }).join('');
    }
  }

  // Gardiens stats
  const ac=document.getElementById('arrets-card');
  const ad2=document.getElementById('arrets-detail');
  if(ac&&match){
    ac.style.display='block';
    const det=match.arrets_detail||{};
    ad2.innerHTML=GARDIENS.map(g=>{
      const n=det[g.num]||0;
      return '<div style="display:flex;align-items:center;gap:10px;padding:6px 0;">'
        +(PHOTOS[g.num]?'<img src="'+PHOTOS[g.num]+'" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid rgba(134,239,172,0.3);">'
          :'<div style="width:36px;height:36px;border-radius:50%;background:rgba(22,101,52,0.3);display:flex;align-items:center;justify-content:center;font-family:Bebas Neue,sans-serif;font-size:14px;color:#86efac;">'+g.num+'</div>')
        +'<div style="flex:1;font-size:14px;color:rgba(255,255,255,0.8);">#'+g.num+' '+g.nom+'</div>'
        +'<div style="font-family:Bebas Neue,sans-serif;font-size:32px;color:#86efac;">'+n+'</div>'
        +'</div>';
    }).join('');
  } else if(ac) ac.style.display='none';

  // Export
  const ec=document.getElementById('export-card');
  if(ec) ec.style.display=match?.status==='finished'?'block':'none';

  // Timeline
  const tl=document.getElementById('timeline');
  if(tl){
    if(!goals.length){tl.innerHTML='<div style="text-align:center;color:rgba(255,255,255,0.3);padding:20px;font-size:14px;">Aucun but pour le moment</div>';}
    else{tl.innerHTML=[...goals].reverse().map(g=>{
      const isAway=g.team==='away';
      const photoEl=!isAway&&PHOTOS[g.joueur_num]?'<img src="'+PHOTOS[g.joueur_num]+'" style="width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid rgba(200,16,46,0.5);flex-shrink:0;">':'';
      return '<div class="tl-item" style="border-left-color:'+(isAway?'#ff6b6b':'var(--red)')+';">'
        +'<div class="tl-score" style="color:'+(isAway?'#ff6b6b':'var(--red-light)')+';">'+g.score_home+'–'+g.score_away+'</div>'
        +photoEl
        +'<div><div style="font-size:13px;font-weight:600;color:#fff;">'+(isAway?'⚽ ':'#'+g.joueur_num+' ')+g.joueur_nom+'</div>'
        +'<div style="font-size:11px;color:var(--gray);">'+(g.half===1?'1ère mi-temps':'2ème mi-temps')+'</div></div></div>';
    }).join('');}
  }
}

// ─── FLASH / NOTIF ───────────────────────────────────────────
function triggerFlash(title, sub, score, bg) {
  document.getElementById('gf-title').textContent = title;
  document.getElementById('gf-player').textContent = sub;
  document.getElementById('gf-score').textContent = score;
  document.getElementById('goal-flash').style.background = bg || 'var(--red)';
  document.getElementById('goal-flash').classList.add('show');
  setTimeout(() => { document.getElementById('goal-flash').classList.remove('show'); document.getElementById('goal-flash').style.background='var(--red)'; }, 2200);
}
function triggerGoalFlash(goal) {
  triggerFlash('BUT !', '#'+goal.joueur_num+' '+goal.joueur_nom, goal.score_home+' – '+goal.score_away, 'var(--red)');
}
function sendNotif(title, body) {
  if ('Notification' in window && Notification.permission === 'granted') new Notification(title, {body});
}

// ─── NAV ─────────────────────────────────────────────────────
function initNav() {
  const pages = userRole==='reporter'
    ? [{id:'setup',icon:'⚙',label:'SETUP'},{id:'live',icon:'🎙',label:'LIVE'},{id:'score',icon:'📊',label:'STATS'},{id:'history',icon:'📋',label:'BUTS'}]
    : [{id:'score',icon:'📊',label:'STATS'},{id:'history',icon:'📋',label:'BUTS'}];
  document.getElementById('bottom-nav').innerHTML = pages.map(p=>`<button class="nav-item" id="nav-${p.id}" onclick="switchPage('${p.id}')"><span class="nav-icon">${p.icon}</span>${p.label}</button>`).join('');
  switchPage(userRole==='reporter' ? (match?'live':'setup') : 'score');
}
function switchPage(id) {
  document.querySelectorAll('.page').forEach(p=>p.style.display='none');
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  const p=document.getElementById('page-'+id); if(p) p.style.display='block';
  const b=document.getElementById('nav-'+id); if(b) b.classList.add('active');
  updateUI();
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showToast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2800);
}

// ─── PDF ─────────────────────────────────────────────────────
function exportMatchPDF() {
  if(!match){showToast('Aucun match à exporter');return;}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const W=doc.internal.pageSize.getWidth();
  doc.setFillColor(200,16,46);doc.rect(0,0,W,35,'F');
  doc.setTextColor(255,255,255);doc.setFontSize(22);doc.setFont(undefined,'bold');
  doc.text('WALLACE HBC LEGÉ — U16A',W/2,14,{align:'center'});
  doc.setFontSize(11);doc.setFont(undefined,'normal');
  doc.text('Résumé du match',W/2,22,{align:'center'});
  if(match.date)doc.text(new Date(match.date).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),W/2,29,{align:'center'});
  doc.setTextColor(30,30,30);doc.setFontSize(11);
  doc.text('HBC Legé',30,50);doc.text(match.adversaire||'Adversaire',W-30,50,{align:'right'});
  doc.setFontSize(36);doc.setFont(undefined,'bold');doc.setTextColor(200,16,46);
  doc.text(match.score_home+' – '+match.score_away,W/2,58,{align:'center'});
  if(match.lieu){doc.setFontSize(10);doc.setFont(undefined,'normal');doc.setTextColor(120,120,120);doc.text('📍 '+match.lieu,W/2,66,{align:'center'});}
  doc.setDrawColor(200,16,46);doc.setLineWidth(0.5);doc.line(20,70,W-20,70);
  let y=80;
  doc.setFontSize(13);doc.setFont(undefined,'bold');doc.setTextColor(200,16,46);doc.text('⚽ BUTEURS',20,y);y+=8;
  const gm={};goals.filter(g=>g.team!=='away').forEach(g=>{const k='#'+g.joueur_num+' '+g.joueur_nom;gm[k]=(gm[k]||0)+1;});
  const gs=Object.entries(gm).sort((a,b)=>b[1]-a[1]);
  if(!gs.length){doc.setFontSize(11);doc.setFont(undefined,'normal');doc.setTextColor(100,100,100);doc.text('Aucun but',25,y);y+=7;}
  else{gs.forEach(([n,c])=>{doc.setFontSize(12);doc.setFont(undefined,'normal');doc.setTextColor(30,30,30);doc.text(n,25,y);doc.setFont(undefined,'bold');doc.setTextColor(200,16,46);doc.text(c+' but'+(c>1?'s':''),W-25,y,{align:'right'});y+=8;});}
  y+=4;doc.setDrawColor(220,220,220);doc.setLineWidth(0.3);doc.line(20,y,W-20,y);y+=10;
  doc.setFontSize(13);doc.setFont(undefined,'bold');doc.setTextColor(22,101,52);doc.text('🧤 GARDIENS',20,y);y+=8;
  const det=match.arrets_detail||{};
  GARDIENS.forEach(g=>{doc.setFontSize(12);doc.setFont(undefined,'normal');doc.setTextColor(30,30,30);doc.text('#'+g.num+' '+g.nom+' — '+(det[g.num]||0)+' arrêt'+(det[g.num]>1?'s':''),25,y);y+=7;});
  y+=4;doc.setDrawColor(220,220,220);doc.line(20,y,W-20,y);y+=8;
  if(sanctions.length){doc.setFontSize(13);doc.setFont(undefined,'bold');doc.setTextColor(180,120,0);doc.text('🟡 SANCTIONS',20,y);y+=8;sanctions.forEach(s=>{doc.setFontSize(11);doc.setFont(undefined,'normal');doc.setTextColor(30,30,30);doc.text((s.type==='yellow'?'Carton jaune':'2 minutes')+' — #'+s.joueur_num+' '+s.joueur_nom+' (MT '+(s.half===1?'1':'2')+')',25,y);y+=7;});y+=4;doc.setDrawColor(220,220,220);doc.line(20,y,W-20,y);y+=8;}
  doc.setFontSize(13);doc.setFont(undefined,'bold');doc.setTextColor(200,16,46);doc.text('📋 CHRONOLOGIE',20,y);y+=8;
  goals.forEach(g=>{if(y>270){doc.addPage();y=20;}const isAway=g.team==='away';doc.setFontSize(10);doc.setFont(undefined,'normal');doc.setTextColor(isAway?180:30,30,30);doc.text('  '+g.score_home+'–'+g.score_away+'  '+(isAway?'But '+g.joueur_nom+' (adv)':'#'+g.joueur_num+' '+g.joueur_nom+' — MT '+(g.half===1?'1':'2')),20,y);y+=6;});
  doc.setFontSize(9);doc.setTextColor(150,150,150);doc.text('#HBCLegé #U16A',W/2,285,{align:'center'});
  doc.save('HBC_Lege_U16A_'+(match.adversaire||'match')+'_'+(match.date||'')+'.pdf');
  showToast('PDF téléchargé ! 📄');
}

window.onload = () => { document.getElementById('setup-date').value = new Date().toISOString().split('T')[0]; };
</script>
</body>
</html>
